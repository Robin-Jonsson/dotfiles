# THEME --- {{{
# Status Bar
set -g status-bg $BG
set -g status-fg $FG

# Panes
set -g pane-border-style "fg=$BORDER"
set -g pane-active-border-style "fg=$BORDER"

# Tabs
setw -g window-status-style "fg=$ALT"
setw -g window-status-format "#I:#W"

setw -g window-status-current-style "fg=$GOLD"
setw -g window-status-current-format "#I:#W"

set -g status-left " "

set -g status-right-style "fg=$ALT"
set -g status-right "%b %d, %Y"
set -ga status-right " #[fg=$ACCENT]%H:%M "
# }}}
